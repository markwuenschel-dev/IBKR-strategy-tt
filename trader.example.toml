# IBKR Tastytrade engine (V4) - example configuration.
#
# Every value below is validated at startup, before anything connects. An
# invalid or contradictory setting prints the field, the value you supplied and
# the constraint it violated, then exits non-zero without placing an order.
#
# Copy to trader.toml and edit.

# Symbols to scan, in order. Upper case, no duplicates.
universe = ["SPY", "QQQ", "AAPL", "MSFT", "NVDA"]

# Where the durable record of proposals, reviews, orders and fills is written.
database_path = "ibkr_trader.sqlite3"

# Seconds between passes when running `loop`. Ignored by `run`.
scan_interval_seconds = 300.0


[ibkr]
host = "127.0.0.1"
# 7497 = TWS paper, 4002 = Gateway paper; 7496/4001 are conventionally live.
# A paper run on a live port only warns: IBKR documents these as defaults that
# can be changed to any open socket, so the number is a hint about intent and
# never evidence about the session. The account check below is the enforcement.
port = 7497
client_id = 1
paper = true
# REQUIRED. The account this process trades. Verified after connecting: the
# session must report this exact account or the process refuses to start.
#
# This proves you reached the account you named. It does NOT prove that account
# is a paper account -- IBKR exposes no paper/live indicator, and the "DU"
# convention is undocumented. Paper safety is you naming the paper account.
account = "DU1234567"
connect_timeout_seconds = 10.0

# Concurrent market-data lines. Hard ceiling is 200 - a larger value is
# rejected at startup, not mid-scan.
refresh_limit = 100

# 1 = live, 2 = frozen, 3 = delayed, 4 = delayed-frozen.
# Options stop quoting outside regular hours, so a live (1) scan before the
# open finds no bid/ask and records data errors rather than trading. That is
# deliberate. Use 2 for an off-hours dry run against the previous session's
# last quotes - and only ever deliberately, since those prices are stale.
market_data_type = 1


[strategy]
# Sell premium only when volatility is historically rich.
min_iv_rank = 30.0

# Days to expiration: aim for target, accept anything inside the band.
target_dte = 45
min_dte = 30
max_dte = 60

# Short strike selection, by absolute delta.
short_delta_target = 0.30
min_short_delta = 0.20
max_short_delta = 0.40

# Long strike selection, by absolute delta. The long put is the further
# out-of-the-money leg; the spread is as wide as the distance between the two
# selected strikes happens to be. There is no fixed width.
long_delta_target = 0.20
min_long_delta = 0.10
max_long_delta = 0.25

# Minimum credit as a fraction of the resulting width. 1/3 is the classic
# Tastytrade bar; a spread that cannot pay it is rejected, never resized.
min_credit_ratio = 0.3333333333333333

# Floor on how far below spot to look for strikes, as a fraction of spot. The
# scanner widens it to strike_window_iv_multiple standard deviations over
# max_dte using the underlying's current implied volatility, so the 0.20-delta
# put on a high-volatility name is still quoted. Every extra percent costs
# contract-qualification round trips on every scan. Set the multiple to 0 to
# use the floor alone.
strike_window_pct = 0.15
strike_window_iv_multiple = 1.2

# Liquidity screens, applied to every leg.
#
# NOTE: IBKR does not deliver open interest under frozen/delayed market data.
# If you run with market_data_type = 2/3/4, min_open_interest = 100 will screen
# out every contract and you will see NO_TRADE on liquidity for every symbol.
# No bid/ask-width gate: width is a ranking preference and a reviewer input,
# not a screen. See tastytrade._liquidity_failure.
min_open_interest = 100
min_volume = 0


[risk]
# Maximum defined risk of one trade, as a fraction of net liquidation value.
max_risk_per_trade = 0.02
max_contracts = 10
max_positions = 10
allow_duplicate_symbol = false


[reviewer]
# The independent reviewer. Note what is absent: no heartbeat interval, no
# liveness deadline, no session lease. It is called once per proposed trade.
#
# By default the review runs through the Claude Code CLI on the operator's
# subscription login: `claude` must be on PATH and logged in (`claude /login`)
# on this machine, and no API key is needed. The alternative is
# backend = "anthropic_api", which calls the API directly and requires
# ANTHROPIC_API_KEY in the environment.
backend = "claude_code"
command = "claude"
model = "claude-sonnet-5"
timeout_seconds = 90.0
# Output ceiling for the anthropic_api backend only; the CLI backend ignores it.
#
# 8192, matching the code default at config.py:246. Thinking tokens are output
# tokens on an adaptive-thinking model and the JSON verdict shares the budget,
# so 1024 risks truncating every review -- a permanent all-reviews-fail mode
# rather than an occasional one. Do not lower this.
max_tokens = 8192


[management]
# How an open spread is worked after the fill -- Tastytrade mechanics, and
# nothing that ever adds contracts or widens a spread. Runs as phase A of
# every `run`/`loop` pass, before the scan, and alone under `manage`.

# Buy the spread back when its value falls to this fraction of the credit
# collected. A GTC order rests at that debit (rounded up to the tick) from
# the pass that first sees the spread filled.
profit_target_ratio = 0.5

# Days to expiration at or below which a spread is no longer held: the profit
# order is cancelled, and the spread is rolled for a net credit or closed.
# Must be below strategy.min_dte, or a spread would be managed the day it
# was opened.
manage_dte = 21

# At manage_dte, try to roll: buy this spread back and sell the next cycle's
# spread (the same selection the scan makes) when the new credit exceeds
# the debit to close. The roll is reviewed like any new trade. Set false to
# always close instead.
roll = true
