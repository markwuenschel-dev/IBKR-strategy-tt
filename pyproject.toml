[project]
name = "ibkr-trader"
version = "4.0.0"
description = "Paper-first Tastytrade options engine: scan, evaluate, review, trade, record."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.40",
    # cli.py resolves ZoneInfo("America/New_York") at import time, so a host with
    # no system tz database cannot even import the CLI without this. Declared
    # unconditionally: the cost is a few hundred KB, and the alternative is a
    # platform marker that leaves minimal Linux containers broken.
    "tzdata",
]

[project.optional-dependencies]
# Only needed to talk to a real TWS / IB Gateway. The whole test suite,
# including the mission test, runs without it.
broker = ["ib_async>=2.0,<3"]
# ruff is pinned exactly, not floored. A formatter's output changes between
# releases, so a floating version makes `ruff format --check` a gate whose
# result depends on the day it ran: 0.15.x formats only Python, 0.16.x also
# formats Markdown, and the two disagree about this tree.
dev = ["pytest>=8", "pytest-timeout>=2", "ruff==0.16.5"]

[project.scripts]
ibkr-trader = "ibkr_trader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ibkr_trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# No test may hang the suite. The mission test uses an injected clock and
# should complete in milliseconds.
timeout = 60

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.format]
# The Markdown code blocks in README.md and docs/ are illustrative pseudocode
# -- `tastytrade.evaluate(...)`, `record(NO_TRADE)` -- with deliberately
# aligned comments, not importable source. Ruff formats Markdown from 0.16
# onward; exclude it rather than let the formatter rewrite documentation.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RET", "ARG", "BLE"]
# `class X(str, Enum)` is deliberate: every use site reads `.value` explicitly,
# and the mixin form keeps the enums usable on interpreters without StrEnum.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Protocol implementations must accept the full interface signature even when a
# particular implementation ignores an argument.
"ibkr_trader/broker.py" = ["ARG002"]
"ibkr_trader/runner.py" = ["ARG001"]
"tests/fakes.py" = ["ARG002"]
"tests/test_broker_encoding.py" = ["ARG002"]
"tests/test_pending_orders.py" = ["ARG002"]
# Test doubles must accept the full vendor signature even where the body
# ignores an argument; same reason as the entries above.
"tests/test_broker_outcomes.py" = ["ARG002"]
"tests/test_scanner_units.py" = ["ARG002"]
"tests/test_durability.py" = ["ARG002"]
"tests/test_scanner_quoting.py" = ["ARG002"]
"tests/test_cli_lifecycle.py" = ["ARG001", "ARG002", "ARG005"]
